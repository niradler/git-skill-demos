name: behavior-evals

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  push:
    branches:
      - main

permissions:
  contents: read
  pull-requests: write

jobs:
  behavior:
    name: Behavior evals on changed skills
    runs-on: ubuntu-latest
    # On PRs, only run when the run-behavior-evals label is applied.
    # On push to main, always run.
    if: >
      github.event_name == 'push' ||
      (github.event_name == 'pull_request' &&
        contains(github.event.pull_request.labels.*.name, 'run-behavior-evals'))
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install eval-runner deps
        working-directory: tools/eval-runner
        run: |
          python -m pip install --upgrade pip
          if [ -f pyproject.toml ]; then
            pip install .
          elif [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

      - name: Detect changed skills
        id: changed
        shell: bash
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base_sha="${{ github.event.pull_request.base.sha }}"
            head_sha="${{ github.event.pull_request.head.sha }}"
            diff_range="${base_sha}...${head_sha}"
          else
            before="${{ github.event.before }}"
            after="${{ github.sha }}"
            if [ -z "$before" ] || [ "$before" = "0000000000000000000000000000000000000000" ]; then
              diff_range="${after}~1...${after}"
            else
              diff_range="${before}...${after}"
            fi
          fi

          changed=$(git diff --name-only "$diff_range" -- 'skills/*' \
            | awk -F'/' 'NF>=2 && $1=="skills" {print $1"/"$2}' \
            | sort -u)

          paths=""
          for p in $changed; do
            if [ -f "$p/SKILL.md" ]; then
              paths="$paths $p"
            fi
          done

          paths="$(echo "$paths" | xargs || true)"
          echo "Changed skill paths: $paths"
          echo "paths=$paths" >> "$GITHUB_OUTPUT"

      - name: Run behavior evals
        id: evals
        if: steps.changed.outputs.paths != ''
        shell: bash
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          set -uo pipefail
          mkdir -p .eval-results
          overall=0
          for skill in ${{ steps.changed.outputs.paths }}; do
            name="$(basename "$skill")"
            out=".eval-results/${name}.json"
            echo "::group::behavior evals: $skill"
            if python tools/eval-runner/run_evals.py --tier behavior "$skill" --json-out "$out"; then
              echo "PASS $skill"
            else
              echo "::error file=$skill/SKILL.md::Behavior evals failed for $skill"
              overall=1
            fi
            echo "::endgroup::"
          done
          echo "status=$overall" >> "$GITHUB_OUTPUT"
          # On main, propagate failure. On PR, advisory (handled below).
          if [ "${{ github.event_name }}" = "push" ]; then
            exit $overall
          fi
          exit 0

      - name: Comment scores on PR
        if: github.event_name == 'pull_request' && steps.changed.outputs.paths != ''
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const dir = '.eval-results';
            let body = '## Behavior eval results\n\n';
            body += `Commit: \`${context.sha.substring(0,7)}\`\n\n`;
            body += '| Skill | Score | Passing | Status |\n';
            body += '|-------|-------|---------|--------|\n';
            let any = false;
            if (fs.existsSync(dir)) {
              for (const f of fs.readdirSync(dir)) {
                if (!f.endsWith('.json')) continue;
                any = true;
                const name = path.basename(f, '.json');
                let row;
                try {
                  const data = JSON.parse(fs.readFileSync(path.join(dir, f), 'utf8'));
                  const score = (data.score ?? data.mean ?? 0).toFixed(2);
                  const passing = (data.passing_score ?? 0.7).toFixed(2);
                  const ok = data.passed === true || Number(score) >= Number(passing);
                  row = `| \`${name}\` | ${score} | ${passing} | ${ok ? 'pass' : 'fail'} |`;
                } catch (e) {
                  row = `| \`${name}\` | n/a | n/a | error: ${e.message} |`;
                }
                body += row + '\n';
              }
            }
            if (!any) body += '_No eval result files produced._\n';
            body += '\n_Behavior evals are advisory on PRs and required on `main`._\n';
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            });

      - name: No skills changed
        if: steps.changed.outputs.paths == ''
        run: echo "No skill directories changed; nothing to evaluate."
